<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Border glow -->
  <rect width="64" height="64" rx="16" fill="none"
    stroke="#7C3AED" stroke-width="1.5" opacity="0.6"/>

  <!-- Inner border subtle -->
  <rect x="3" y="3" width="58" height="58" rx="13.5" fill="none"
    stroke="#a78bfa" stroke-width="0.5" opacity="0.2"/>

  <!-- Letter C -->
  <path d="M14 32 C14 22 20 15 28 15 C31 15 34 16 36 18"
    fill="none" stroke="url(#purple)" stroke-width="4"
    stroke-linecap="round" filter="url(#glow)"/>
  <path d="M36 46 C34 48 31 49 28 49 C20 49 14 42 14 32"
    fill="none" stroke="url(#purple)" stroke-width="4"
    stroke-linecap="round" filter="url(#glow)"/>

  <!-- Letter B -->
  <line x1="40" y1="15" x2="40" y2="49"
    stroke="url(#purple)" stroke-width="4"
    stroke-linecap="round" filter="url(#glow)"/>
  <!-- B top bump -->
  <path d="M40 15 C48 15 52 19 52 24 C52 29 48 32 40 32"
    fill="none" stroke="url(#purple)" stroke-width="4"
    stroke-linecap="round" filter="url(#glow)"/>
  <!-- B bottom bump -->
  <path d="M40 32 C49 32 53 36.5 53 41 C53 45.5 49 49 40 49"
    fill="none" stroke="url(#purple)" stroke-width="4"
    stroke-linecap="round" filter="url(#glow)"/>

  <!-- Cyan accent dot top-right -->
  <circle cx="54" cy="10" r="4" fill="#06b6d4" opacity="0.9" filter="url(#glow-cyan)"/>
  <circle cx="54" cy="10" r="2" fill="#a5f3fc"/>

  <!-- Small star sparkle top-left -->
  <g transform="translate(10,10)" filter="url(#glow-cyan)">
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#a78bfa" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#a78bfa" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-2.8" y1="-2.8" x2="2.8" y2="2.8" stroke="#a78bfa" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
    <line x1="2.8" y1="-2.8" x2="-2.8" y2="2.8" stroke="#a78bfa" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Tiny dot bottom-left -->
  <circle cx="11" cy="54" r="2" fill="#7C3AED" opacity="0.5"/>
</svg>
